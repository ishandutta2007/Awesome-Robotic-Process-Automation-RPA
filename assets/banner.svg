<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="16" />
  
  <!-- Grid Pattern -->
  <g opacity="0.08">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200" stroke="#ffffff" stroke-width="1" />
    <path d="M100 0 V300 M200 0 V300 M300 0 V300 M400 0 V300 M500 0 V300 M600 0 V300 M700 0 V300 M800 0 V300 M900 0 V300 M1000 0 V300 M1100 0 V300" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Dynamic Animated Background Elements -->
  <g opacity="0.3">
    <!-- Animated Flow Lines in Background -->
    <path d="M 80 230 Q 300 40 600 230 T 1120 70" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="10 12">
      <animate attributeName="stroke-dashoffset" values="0;90" dur="8s" repeatCount="indefinite" />
    </path>
    <path d="M 60 70 Q 400 270 800 70 T 1140 230" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" values="90;0" dur="10s" repeatCount="indefinite" />
    </path>

    <!-- Pulsing Nodes -->
    <circle cx="120" cy="90" r="6" fill="#38bdf8">
      <animate attributeName="r" values="4;8;4" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="1080" cy="210" r="7" fill="#c084fc">
      <animate attributeName="r" values="5;10;5" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Side Floating Cards -->
  <g opacity="0.35">
    <rect x="40" y="160" width="140" height="36" rx="8" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1" />
    <rect x="1020" y="100" width="140" height="36" rx="8" fill="url(#cardBg)" stroke="#c084fc" stroke-width="1" />
  </g>

  <!-- Main Center Content (Foreground Unobstructed) -->
  <g text-anchor="middle">
    <!-- Top Pill Badge -->
    <rect x="430" y="38" width="340" height="32" rx="16" fill="url(#cardBg)" stroke="url(#accent)" stroke-width="1.5" />
    <text x="600" y="59" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">⚡ THE RPA &amp; AUTOMATION ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="132" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
      Awesome Robotic Process Automation
    </text>
    
    <!-- Accent Line -->
    <rect x="450" y="152" width="300" height="4" rx="2" fill="url(#accent)" />

    <!-- Subtitle -->
    <text x="600" y="196" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      Curated Guide to Enterprise Commercial RPA Platforms &amp; Open-Source Automation Frameworks
    </text>

    <!-- Bottom Feature Tags -->
    <g font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">
      <rect x="340" y="226" width="150" height="30" rx="15" fill="#1e293b" stroke="#334155" />
      <text x="415" y="245" fill="#cbd5e1">🚀 Enterprise SaaS</text>

      <rect x="525" y="226" width="150" height="30" rx="15" fill="#1e293b" stroke="#334155" />
      <text x="600" y="245" fill="#cbd5e1">🐍 Open-Source RPA</text>

      <rect x="710" y="226" width="150" height="30" rx="15" fill="#1e293b" stroke="#334155" />
      <text x="785" y="245" fill="#cbd5e1">🤖 AI Agents &amp; Bots</text>
    </g>
  </g>
</svg>
